<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /*
       * Marks the document as JS-capable BEFORE first paint. Scroll-reveal
       * styles are only applied when this class is present, so if the bundle
       * fails to load or never finishes, content renders visible instead of
       * being trapped at opacity 0.
       */
      document.documentElement.className += ' js';
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4C65F5" />

    <title>Special Learns Institute | Computer Courses in New Delhi</title>
    <meta
      name="description"
      content="Special Learns Institute in Uttam Nagar, New Delhi offers computer courses from basic computer and Tally to web development, graphic design and programming."
    />
    <link rel="canonical" href="https://speciallearns.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Special Learns Institute" />
    <meta property="og:title" content="Special Learns Institute | Computer Courses in New Delhi" />
    <meta
      property="og:description"
      content="Computer courses in Uttam Nagar, New Delhi. Learn computer skills, accounting, design, web development and more."
    />
    <meta property="og:url" content="https://speciallearns.in/" />
    <meta property="og:image" content="https://speciallearns.in/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts: preconnect first, then a single stylesheet request with only the
         weights actually used. `display=swap` keeps text readable while loading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

        </p>
        <p>
          K-3, Mohan Garden, 40 Feet Road, Near R.P Memorial School, Uttam Nagar, New Delhi 110059

    <script type="module" src="/src/main.jsx"></script>
